name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because Windows-only failures (expanduser
        # reading USERPROFILE, files left open blocking temp-dir cleanup)
        # have slipped through when only Linux ran the tests.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.14"]
        # Python 3.8 is end-of-life and may not be available on the Ubuntu 26
        # image that ubuntu-latest moves to on 2026-10-19, so pin its job.
        exclude:
        - os: ubuntu-latest
          python-version: "3.8"
        include:
        - os: ubuntu-24.04
          python-version: "3.8"
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run the unit tests
      # Stdlib-only; Ollama calls are mocked, so no server or pip install is needed.
      run: python -m unittest discover -s tests -v

  isolated-code-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Provision the test-only Python image
      run: docker pull python:3.12-slim
    - name: Verify container isolation, output limits and descendant cleanup
      env:
        DUAL_TEST_DOCKER: '1'
      run: python -m unittest discover -s tests -p test_coderun_docker.py -v
