name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # One job on a current Python with a pinned Pylint, so every run applies
    # the same rules. (Running on several old Pythons installed a different
    # Pylint release on each, because newer releases drop old Pythons.)
    # Python-version compatibility is the Tests workflow's job.
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint==4.1.2
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
