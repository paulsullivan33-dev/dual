# Build profile for the matrix-bridge sketch.
# Board core: arduino:zephyr (Uno Q). Flashes via /dev/ttyHS1 from the Q itself.
profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
      - Arduino_RouterBridge (0.4.3)
      # NOTE: Arduino_LED_Matrix is bundled with the zephyr core -- do NOT
      # list it here, or arduino-cli tries (and fails) to download it.
default_profile: default
